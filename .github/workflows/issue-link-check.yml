name: issue-link-check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  check:
    name: issue-link-check
    runs-on: ubuntu-latest
    if: "github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER'"
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const refs = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map(m => Number(m[1]));

            let reason = '';
            let ok = false;

            for (const n of refs) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: n
                });
                if (issue.pull_request) {
                  reason = `#${n} 是 PR,不是 issue`;
                  continue;
                }
                if (issue.state !== 'open') {
                  reason = `#${n} 已关闭`;
                  continue;
                }
                const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
                if (labels.includes('wontfix')) {
                  reason = `#${n} 标记为 wontfix`;
                  continue;
                }
                ok = true;
                break;
              } catch {
                reason = `#${n} 不存在`;
              }
            }

            if (!ok) {
              core.setFailed(reason || 'PR 未关联有效 issue');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  '这个 PR 没有关联到有效的 issue。',
                  '',
                  '请先在 Issues 中确认已有相关问题;如果没有,用模板新建一个,',
                  '然后在 PR 描述里写 `Closes #编号`。',
                  '',
                  reason ? `当前问题:${reason}` : ''
                ].join('\n')
              });
            }
