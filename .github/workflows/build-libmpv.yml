name: Build libmpv (audio effects)

# 手动触发，不挂 push/tag，避免和 release.yml 抢时间。
# 产物是带音效滤镜白名单的 Windows x64 libmpv-2.dll，下载后替换仓库
# libmpv/libmpv-2.dll，再重新构建客户端。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build libmpv
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\usr\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) {
            throw "Git Bash not found: $bash"
          }
          # ★ 构建目录必须短。GitHub 的默认仓库路径是
          #   D:\a\bowen_music\bowen_music\artifacts\native-mpv，
          #   FFmpeg install 头文件那条命令会超过 Windows 命令行长度，
          #   被截断成 D:/a/bowen_music/bowen_mus 并报 "target ... is not a directory"。
          python tools/mpv/build_audio_mpv.py --work-dir C:\mpvbuild --jobs 4 --bash $bash

      - name: Show result
        if: always()
        shell: pwsh
        run: |
          $out = 'C:\mpvbuild\output'
          if (Test-Path -LiteralPath $out) {
            Get-ChildItem -LiteralPath $out | Format-Table Name, Length
            $manifest = Join-Path $out 'build-manifest.json'
            if (Test-Path -LiteralPath $manifest) {
              Get-Content -LiteralPath $manifest -Raw
            }
          }

      - name: Upload libmpv
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-audio-effects
          path: |
            C:/mpvbuild/output/libmpv-2.dll
            C:/mpvbuild/output/audio-profile.json
            C:/mpvbuild/output/build-manifest.json
            C:/mpvbuild/logs/ffmpeg-configure.log
            C:/mpvbuild/logs/ffmpeg-compile.log
            C:/mpvbuild/logs/mpv-configure.log
            C:/mpvbuild/logs/mpv-compile.log
            C:/mpvbuild/logs/imports.log
          if-no-files-found: warn
          retention-days: 14
