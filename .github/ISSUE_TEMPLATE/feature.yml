name: 功能许愿
description: 希望新增的功能
title: "[许愿] "
labels: ["功能许愿"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 想要的功能
      placeholder: 例如:支持桌面歌词悬浮窗
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么情况下需要它,解决什么问题
      placeholder: 例如:边工作边听歌,切到别的窗口就看不到歌词
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 目前的替代做法
      description: 可填可不填
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue,没有重复
          required: true
        - label: 这个功能目前确实没有
          required: true
