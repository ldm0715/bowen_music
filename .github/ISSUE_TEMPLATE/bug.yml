name: Bug 反馈
description: 功能异常、崩溃、播放出错
title: "[Bug] "
labels: ["bug反馈"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写完整,便于定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么,和预期有什么不同
      placeholder: 例如:切到下一首后没有声音,但进度条正常走动
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 可在设置中查看,或看安装包文件名
      placeholder: 例如 0.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
      description: 可以直接拖入截图
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue,没有重复
          required: true
        - label: 我使用的是最新版本
          required: false
